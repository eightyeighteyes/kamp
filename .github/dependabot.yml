version: 2
# Conventional prefixes so Dependabot's titles pass pr-title.yml and runtime
# bumps reach release-please's Dependencies section (KAMP-784).
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "chore"

  - package-ecosystem: "npm"
    directory: "/kamp_ui"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
