name: PR Title

# Release-please only counts conventional-commit subjects (feat:, fix:, ...),
# and the squash merge takes its subject from the PR title. Between 1.27.0 and
# 1.28.0, every merge was titled "KAMP-NNN: ..." and release-please silently
# skipped all of them (KAMP-784), so the title is checked before merge.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The conventional types, plus release-please's visible "deps".
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            style
            refactor
            test
            build
            ci
            chore
          requireScope: false
          # The repo squashes a single-commit PR under its *commit* message,
          # not its title (squash_merge_commit_title = COMMIT_OR_PR_TITLE), so
          # that commit has to pass too, or a good title proves nothing.
          validateSingleCommit: true
