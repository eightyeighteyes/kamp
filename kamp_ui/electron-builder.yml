appId: com.kamp.app
productName: Kamp
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Exclude binary build artifacts — handled by extraResources (copied directly
  # to Contents/Resources/ outside the ASAR, no double-packing).
  - '!resources/kamp/**'
  - '!resources/mpv'
  - '!resources/mpv/**'
  - '!resources/mpv-libs/**'
  - '!resources/node'
  - '!resources/node.exe'
  - '!resources/npm/**'
  - '!resources/icon_1024.png'
  - '!resources/now-playing-helper'
  - '!resources/now-playing-helper.exe'
  - '!resources/kamp-keychain-helper'
  # Explicitly include compiled JS (electron-vite output) so it is packed into
  # the ASAR. Without this, the positive 'extensions/**' pattern below changes
  # electron-builder's default glob behavior and out/ is not included.
  - 'out/**'
  - 'extensions/**'
  # Groover is a dev tool / optional npm add-on; it distributes via npm, not
  # in the app bundle. This exclusion is belt-and-suspenders: Groover lives at
  # the repo root (../extensions/kamp-groover), outside this build context, so
  # it is already absent from the ASAR. The pattern guards against accidental
  # inclusion if the directory is ever moved into kamp_ui/extensions/.
  - '!extensions/kamp-groover/**'
asarUnpack:
  - resources/**
# extraResources is declared per-platform below. electron-builder treats a
# top-level extraResources entry as a fallback that is fully replaced by any
# platform-specific block, so the mac and win lists are kept symmetric to
# avoid surprises when adding new platforms.
win:
  executableName: kamp
  icon: build/icon.ico
  # Azure Trusted Signing — auth uses DefaultAzureCredential which reads
  # AZURE_TENANT_ID, AZURE_CLIENT_ID, and AZURE_CLIENT_SECRET from the environment.
  # See docs/code-signing.md for setup instructions.
  azureSignOptions:
    publisherName: 'Theodore Terry'
    endpoint: 'https://eus.codesigning.azure.net/'
    codeSigningAccountName: 'kamp-signing'
    certificateProfileName: 'kamp-public'
  extraResources:
    # PyInstaller onedir bundle → resources\kamp\
    - from: resources/kamp
      to: kamp
      filter:
        - '**/*'
    # mpv directory contains mpv.exe + sibling mingw runtime DLLs. Windows
    # resolves DLLs from the executable's directory, so the whole folder
    # ships intact (no rewriting needed, unlike macOS @executable_path).
    - from: resources/mpv
      to: mpv
      filter:
        - '**/*'
    # Rust SMTC helper — Windows analog of the macOS Swift now-playing-helper.
    # Owns SystemMediaTransportControls so media keys route to Kamp and the
    # Action Center Now Playing widget shows the current track (KAMP-56).
    - from: resources/now-playing-helper.exe
      to: now-playing-helper.exe
    # Bundled Node + npm — required for community-extension install where
    # the user may have no Node.js on their machine.
    - from: resources/node.exe
      to: node.exe
    - from: resources/npm
      to: npm
      filter:
        - '**/*'
    # npm's own bundled node_modules — copied separately because app-builder
    # excludes node_modules from **/* by default.
    - from: resources/npm/node_modules
      to: npm/node_modules
      filter:
        - '**/*'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
  # All kamp resources are pre-signed in parallel before electron-builder runs.
  # signIgnore skips them so electron-builder only signs the outer .app shell.
  # Python.framework binaries are pre-signed with --identifier to bypass the
  # "bundle format is ambiguous" error from the non-standard PyInstaller layout.
  signIgnore:
    - 'Contents/Resources/kamp'
    - 'Contents/Resources/mpv'
    - 'Contents/Resources/mpv-libs'
    - 'Contents/Resources/node'
    - 'Contents/Resources/now-playing-helper'
    - 'Contents/Resources/kamp-keychain-helper'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  extraResources:
    # PyInstaller onedir bundle → Contents/Resources/kamp/
    - from: resources/kamp
      to: kamp
      filter:
        - '**/*'
    # Standalone mpv binary → Contents/Resources/mpv
    - from: resources/mpv
      to: mpv
    # Bundled mpv dylibs → Contents/Resources/mpv-libs/
    # dylibbundler rewrites mpv's load commands to @executable_path/mpv-libs/<lib>
    # so this directory must be a sibling of the mpv binary in Contents/Resources/.
    - from: resources/mpv-libs
      to: mpv-libs
      filter:
        - '**/*'
    # Swift Now Playing helper → Contents/Resources/now-playing-helper
    - from: resources/now-playing-helper
      to: now-playing-helper
    # Swift Keychain helper → Contents/Resources/kamp-keychain-helper
    - from: resources/kamp-keychain-helper
      to: kamp-keychain-helper
    # Node.js binary + npm CLI — required for extension install/uninstall in the
    # packaged app where the user may not have Node.js on their machine.
    - from: resources/node
      to: node
    - from: resources/npm
      to: npm
      filter:
        - '**/*'
    # npm's own bundled node_modules — copied as a separate entry so app-builder
    # does not strip it (app-builder excludes node_modules from **/* by default).
    - from: resources/npm/node_modules
      to: npm/node_modules
      filter:
        - '**/*'
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  # KAMP-675: the mount window as a turntable — see kamp_ui/resources/
  # dmg_background.svg, which carries the full layout rationale.
  #
  # Named explicitly rather than relying on the implicit build/background.png
  # lookup, and that is deliberate: getResource (app-builder-lib
  # platformPackager.js) THROWS InvalidConfigurationError when an explicit path
  # is missing, whereas the implicit lookup falls through to electron-builder's
  # own stock template (dmg-builder dmgUtil.js computeBackground). The implicit
  # form would therefore ship an unbranded DMG on green CI if the render step
  # ever stopped producing the file. This path is resolved against the project
  # dir; the @2x sibling is picked up automatically and the pair is fused into
  # a multi-resolution TIFF by tiffutil.
  background: resources/dmg_background.png
  # Both entries are required. dmg-builder only injects the default app +
  # /Applications pair when `contents` is absent entirely, so a partial list
  # silently ships a DMG with no drop target.
  #
  # x/y are the icon CENTRE, y measured from the top of the window. The window
  # is 540x300 because that is the background's own size — dmg.window is
  # ignored whenever a background image is set, so it is deliberately not set
  # here. iconSize is likewise left to its default of 80; the art is drawn to
  # that number, so changing either means redrawing the SVG.
  contents:
    # No `path` on this entry: dmg-builder substitutes the built .app when it
    # is omitted, and an absolute path outside the workspace root is rejected
    # outright.
    - x: 130
      y: 140
      type: file
      name: Kamp.app
    - x: 410
      y: 140
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
