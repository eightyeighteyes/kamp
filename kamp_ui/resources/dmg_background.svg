<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kamp DMG installer background (KAMP-675).

  With a background image the image's own pixel dimensions ARE the mount
  window's size — dmg.window is ignored (dmg-builder/out/dmgUtil.js derives the
  size from the image via sips, then spreads an undefined settings.window over
  it). So this canvas is the window.

  Generate the PNG pair:
    bash scripts/make_dmg_background.sh

  == Layout contract with electron-builder.yml ==
  dmg.contents places two items at x=130 and x=410, y=140, where y is measured
  from the TOP of the window to the item's CENTRE. At iconSize 80 each occupies
  y 100-180. Every coordinate here derives from that; move an item in the yml
  and this art must move with it.

  == Three measured constraints, not assumptions ==

  1. Labels must land on orange. Finder draws each filename directly below its
     icon and nothing in electron-builder controls that text's colour. Measured
     off a real mounted build, the glyphs start 11.5px below the icon's bottom
     edge. On this orange a label reads either way (6.0:1 black, 3.5:1 white);
     over the deck colour black would be 1.1:1, i.e. invisible. So the boxes
     end at y=188 and the glyphs start at y=191.5.

  2. That caps each box at 100x100 around an 80px icon, and the box must be
     CENTRED on its icon. An earlier cut sat each box's base on its icon's
     baseline to satisfy (1), which put the box centre 20px above the icon
     centre and left the icon reading visibly low.

  3. The Applications icon paints 78x62 of its 80x80 cell, so it covers almost
     all of any platter that fits inside the box (1) and (2) allow — the usable
     rim works out at ~9px whatever iconSize is set to, because the box cap and
     the icon scale together. Nothing is therefore drawn inside r=39: the inner
     rings and centre label an earlier cut had there were painted entirely
     behind the folder. The platter reads through its rim alone, so the rim is
     where the weight goes.

  == Why orange is the ground but never carries the line work ==
  Measured contrast against #bf7a20: the deck (#1c1a16) is 4.98:1 and the app
  icon's own #141414 tile is 5.28:1 — both read strongly, which is what makes
  "background is kamp orange, elements pop" work. But the gold kamp draws line
  work in (#c4aa78) is 1.56:1 on orange and 7.75:1 on #141414. So dark masses
  sit on the orange and gold detail only ever sits on the dark.
-->
<svg
  width="540"
  height="300"
  viewBox="0 0 540 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Ground: the record-label orange from icon_source.svg's centre label. -->
  <rect width="540" height="300" fill="#bf7a20" />

  <!-- ==================== LEFT: the record, on its mat ====================
       The app icon is an opaque 80x80 square whose own background is #141414
       (icon.icns is drawn as authored; Finder applies no squircle mask). The
       mat is filled with that exact colour so the tile's edges dissolve into
       it and only the record remains visible — at the #1c1a16 used for the
       platter it reads as a square-within-a-square, because 1.06:1 is far too
       little to see as a colour but quite enough to see as an edge.

       A disc would suit the metaphor better but cannot work: one large enough
       to contain the icon's square corners needs r>=57, which reaches past the
       label. Hence a rounded rect, centred, 8px margin.
  -->
  <g>
    <rect x="82" y="92" width="96" height="96" rx="12"
          fill="#141414" stroke="#c4aa78" stroke-width="1.2" />
    <rect x="88" y="98" width="84" height="84" rx="8"
          fill="none" stroke="#c4aa78" stroke-width="0.7" opacity="0.25" />
  </g>

  <!-- ==================== RIGHT: the record player ====================
       The Applications drop target sits on the platter. Its icon is the system
       folder and cannot be replaced: electron-builder's DmgContent exposes no
       per-item icon; NSWorkspace.setIcon follows a symlink to the real
       /Applications; macOS refuses a resource fork on a symlink outright; and
       an alias file, which can carry an icon, is not a drop target because it
       does not stat as a directory. A DMG drop target is therefore necessarily
       a symlink and necessarily shows this icon.

       So the turntable is drawn around it rather than under it: see note (3)
       in the header — everything inside r=39 would be hidden.
  -->
  <g>
    <!-- Plinth. Same height and vertical position as the mat so the two sides
         sit on one line, and the same #141414 for one continuous deck colour. -->
    <rect x="320" y="92" width="180" height="96" rx="12"
          fill="#141414" stroke="#c4aa78" stroke-width="1.2" />

    <!-- Platter. A true circle, centred on the drop target and on the plinth.
         r=46 is the largest that stays inside the plinth's 96px height, which
         is what makes the rim as wide as it can be. -->
    <circle cx="410" cy="140" r="46" fill="#1c1a16" stroke="#c4aa78" stroke-width="1.1" />
    <circle cx="410" cy="140" r="42" fill="none" stroke="#c4aa78" stroke-width="0.6"
            opacity="0.35" />

    <!-- Tonearm, in the splash screen's vocabulary — counterweight, pivot post,
         bent arm, stylus head (SplashScreen.tsx). The counterweight is what
         makes it legible as a tonearm at this size rather than a stray line.
         The stylus lands at x=452,y=147: on the platter's visible right rim,
         clear of the folder's painted edge at x=449. -->
    <rect x="473" y="102" width="12" height="7" rx="3"
          fill="#141414" stroke="#c4aa78" stroke-width="1.1" />
    <circle cx="479" cy="117" r="5" fill="#141414" stroke="#c4aa78" stroke-width="1.3" />
    <circle cx="479" cy="117" r="1.7" fill="#c4aa78" />
    <path d="M 479 117 L 475 138 Q 473 146 452 147"
          fill="none" stroke="#c4aa78" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="452" cy="147" r="2.6" fill="none" stroke="#c4aa78" stroke-width="1.1" />
    <circle cx="452" cy="147" r="1.3" fill="#c4aa78" />

    <!-- Controls on the plinth's free left edge. At y=170 the platter spans
         only x 375-445, so these clear it by 14px — an earlier cut had them
         overlapping, which is what made this side read as a mess. -->
    <circle cx="340" cy="170" r="5" fill="none" stroke="#c4aa78" stroke-width="1" />
    <circle cx="356" cy="170" r="5" fill="none" stroke="#c4aa78" stroke-width="1" />
    <rect x="334" y="110" width="4" height="26" rx="2"
          fill="none" stroke="#c4aa78" stroke-width="1" opacity="0.7" />
  </g>

  <!-- ==================== The gesture ====================
       Dark on orange (4.98:1) rather than gold, per the contrast rule above.
  -->
  <g opacity="0.8">
    <path d="M 215 140 L 285 140" stroke="#1c1a16" stroke-width="2.5"
          stroke-linecap="round" />
    <path d="M 276 132 L 285 140 L 276 148" fill="none" stroke="#1c1a16"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
